<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Mouse Keys Record Replay">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f9ff"/><stop offset="1" stop-color="#e8f0ff"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e95ff"/><stop offset="1" stop-color="#0062d6"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#dbe6f8" stroke-width="1"/></pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0062d6" flood-opacity="0.28"/></filter>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#grid)" opacity="0.6"/>
  <g transform="translate(96 72)" filter="url(#sh)">
    <rect width="176" height="176" rx="40" fill="url(#tile)"/>
    <circle cx="88" cy="88" r="44" fill="none" stroke="#fff" stroke-width="13"/>
    <circle cx="88" cy="88" r="19" fill="#fff"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="320" y="138" font-size="54" font-weight="700" fill="#0b1b33" letter-spacing="-1">Mouse Keys Record Replay</text>
    <text x="322" y="184" font-size="24" fill="#44546d">Record your mouse and keyboard with one shortcut. Replay once or on a loop.</text>
    <g font-size="17" font-weight="600" fill="#0b1b33">
      <rect x="322" y="214" width="112" height="38" rx="19" fill="#ffffff" stroke="#cfdcf2"/><text x="378" y="239" text-anchor="middle">Windows</text>
      <rect x="446" y="214" width="96" height="38" rx="19" fill="#ffffff" stroke="#cfdcf2"/><text x="494" y="239" text-anchor="middle">macOS</text>
      <rect x="554" y="214" width="88" height="38" rx="19" fill="#ffffff" stroke="#cfdcf2"/><text x="598" y="239" text-anchor="middle">Linux</text>
      <rect x="654" y="214" width="150" height="38" rx="19" fill="#ffffff" stroke="#cfdcf2"/><text x="729" y="239" text-anchor="middle">Free, MIT</text>
    </g>
  </g>
</svg>
